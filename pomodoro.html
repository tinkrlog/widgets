<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #191919;
    font-family: 'SFMono-Regular', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    color: #e8e6e3;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .widget {
    padding: 20px 28px;
    text-align: center;
    width: 100%;
    max-width: 360px;
  }
  .mode-tabs {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .tab {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    color: #666;
    background: transparent;
    border: 1px solid transparent;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab.active {
    color: #f5c542;
    border-color: #f5c54233;
    background: #f5c54210;
  }
  .tab:hover:not(.active) { color: #999; }
  .timer-display {
    font-size: 64px;
    font-weight: 700;
    color: #e8e6e3;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .timer-display .colon { color: #f5c542; }
  .timer-display.break-mode { color: #4ade80; }
  .timer-display.break-mode .colon { color: #4ade80; }
  .session-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .btn-primary {
    background: #f5c542;
    color: #1a1a1a;
    font-weight: 600;
  }
  .btn-primary:hover { background: #e8b830; }
  .btn-primary.running {
    background: #333;
    color: #ccc;
  }
  .btn-primary.running:hover { background: #444; }
  .btn-ghost {
    background: transparent;
    color: #555;
    border: 1px solid #333;
  }
  .btn-ghost:hover { color: #999; border-color: #555; }
  .cycles {
    margin-top: 14px;
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
  }
  .dot.done { background: #f5c542; }
  .dot.break-done { background: #4ade80; }
</style>
</head>
<body>
<div class="widget">
  <div class="mode-tabs">
    <button class="tab active" data-mins="25" data-mode="work">Focus</button>
    <button class="tab" data-mins="5" data-mode="break">Break</button>
    <button class="tab" data-mins="15" data-mode="long">Long break</button>
  </div>
  <div class="timer-display" id="display">25<span class="colon">:</span>00</div>
  <div class="session-label" id="label">ready to focus</div>
  <div class="controls">
    <button class="btn btn-primary" id="startBtn">Start</button>
    <button class="btn btn-ghost" id="resetBtn">Reset</button>
  </div>
  <div class="cycles" id="cycles"></div>
</div>
<script>
  let totalSecs, remaining, interval = null, running = false;
  let currentMode = 'work';
  let completed = 0;

  const display = document.getElementById('display');
  const label = document.getElementById('label');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const cyclesEl = document.getElementById('cycles');

  function setMode(mins, mode) {
    clearInterval(interval); interval = null; running = false;
    currentMode = mode;
    totalSecs = mins * 60; remaining = totalSecs;
    render();
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    label.textContent = mode === 'work' ? 'ready to focus' : 'time to recharge';
    display.classList.toggle('break-mode', mode !== 'work');

    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.mode === mode);
    });
  }

  function render() {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    display.innerHTML = String(m).padStart(2,'0') +
      '<span class="colon">:</span>' + String(s).padStart(2,'0');
    if (currentMode !== 'work') display.classList.add('break-mode');
  }

  function renderCycles() {
    cyclesEl.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i < completed ? ' done' : '');
      cyclesEl.appendChild(dot);
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      clearInterval(interval); interval = null; running = false;
      startBtn.textContent = 'Resume';
      startBtn.classList.remove('running');
      label.textContent = 'paused';
    } else {
      running = true;
      startBtn.textContent = 'Pause';
      startBtn.classList.add('running');
      label.textContent = currentMode === 'work' ? 'deep work' : 'resting';
      interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval); interval = null; running = false;
          if (currentMode === 'work') {
            completed = Math.min(completed + 1, 4);
            renderCycles();
            label.textContent = 'session done ⚡';
          } else {
            label.textContent = 'break over — back to it';
          }
          startBtn.textContent = 'Start';
          startBtn.classList.remove('running');
          remaining = 0;
        }
        render();
      }, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    const tab = document.querySelector('.tab.active');
    setMode(parseInt(tab.dataset.mins), tab.dataset.mode);
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      setMode(parseInt(tab.dataset.mins), tab.dataset.mode);
    });
  });

  setMode(25, 'work');
  renderCycles();
</script>
</body>
</html>
