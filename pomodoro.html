<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  .wrap { text-align: center; }
  .mode { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  .timer { font-size: 56px; font-weight: 700; letter-spacing: -3px; color: var(--text); }
  .timer .colon { color: var(--amber); }
  .sessions { font-size: 9px; color: var(--text-ghost); letter-spacing: 1px; margin: 10px 0 16px; }
  .sessions .done { color: var(--amber); }
  .btns { display: flex; gap: 8px; justify-content: center; }
  .btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); }
  .btn.active { background: var(--amber); color: #0d0d0d; border-color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mode" id="mode">focus</div>
  <div class="timer" id="timer">25<span class="colon">:</span>00</div>
  <div class="sessions" id="sessions"></div>
  <div class="btns">
    <button class="btn" id="startBtn" onclick="toggle()">Start</button>
    <button class="btn" id="resetBtn" onclick="reset()">Reset</button>
  </div>
</div>
<script>
const FOCUS = 25 * 60, BREAK = 5 * 60;
let seconds = FOCUS, running = false, interval = null, mode = 'focus', count = 0;

function render() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  document.getElementById('timer').innerHTML = `${m}<span class="colon">:</span>${s}`;
  document.getElementById('mode').textContent = mode;
  const dots = Array.from({length: 4}, (_, i) => i < count ? '⚡' : '·').join(' ');
  document.getElementById('sessions').innerHTML = dots;
}

function toggle() {
  if (running) {
    clearInterval(interval);
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.remove('active');
  } else {
    interval = setInterval(() => {
      seconds--;
      if (seconds < 0) {
        clearInterval(interval);
        running = false;
        if (mode === 'focus') { count++; mode = 'break'; seconds = BREAK; }
        else { mode = 'focus'; seconds = FOCUS; }
        document.getElementById('startBtn').textContent = 'Start';
        document.getElementById('startBtn').classList.remove('active');
      }
      render();
    }, 1000);
    document.getElementById('startBtn').textContent = 'Pause';
    document.getElementById('startBtn').classList.add('active');
  }
  running = !running;
}

function reset() {
  clearInterval(interval);
  running = false;
  mode = 'focus';
  seconds = FOCUS;
  document.getElementById('startBtn').textContent = 'Start';
  document.getElementById('startBtn').classList.remove('active');
  render();
}

render();
</script>
</body>
</html>
